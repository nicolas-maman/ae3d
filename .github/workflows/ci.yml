name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libvulkan-dev xvfb

      - name: Install dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install glfw

      # install.sh is a bash script that changes to its own directory and builds
      # the compiler from the tree around it. Piping it into a shell gave it
      # neither: dash rejected its options on Linux, and on macOS it ran make in
      # this checkout instead, which has no compiler to build.
      - name: Install the Aether toolchain
        run: |
          git clone --depth 1 https://github.com/aether-lang-dev/aether.git "$RUNNER_TEMP/aether"
          (cd "$RUNNER_TEMP/aether" && ./install.sh)
          echo "$HOME/.aether/bin" >> "$GITHUB_PATH"

      - name: Run CI
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./ci.sh
          else
            ./ci.sh
          fi
